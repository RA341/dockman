syntax = "proto3";

package docker.v1;

option go_package = "github.com/RA341/dockman/generated/docker/v1";

service DockerService {
  // container
  rpc ContainerStart(ContainerRequest) returns (LogsMessage) {}
  rpc ContainerStop(ContainerRequest) returns (LogsMessage) {}
  rpc ContainerRemove(ContainerRequest) returns (LogsMessage) {}
  rpc ContainerRestart(ContainerRequest) returns (LogsMessage) {}
  rpc ContainerPause(ContainerRequest) returns (LogsMessage) {}
  rpc ContainerUnpause(ContainerRequest) returns (LogsMessage) {}
  // force-updates the containers' images (pull, recreate when the image
  // changed, rollback on failure), streaming per-step progress
  rpc ContainerUpdate(ContainerRequest) returns (stream LogsMessage) {}
  rpc ContainerTop(ContainerTopRequest) returns (ContainerTopResponse) {}

  rpc ContainerList(ContainerListRequest) returns (ListResponse) {}
  rpc ContainerStats(StatsRequest) returns (StatsResponse) {}
  // streams each container's stats as soon as its read completes, so the UI
  // fills in progressively instead of waiting for the slowest container
  // (fully qualified return type: the sibling ContainerStats rpc otherwise
  // shadows the message name inside the service scope)
  rpc ContainerStatsStream(StatsRequest) returns (stream .docker.v1.ContainerStats) {}
  // real host-level usage (from /proc via the host's runner, so it works for
  // ssh hosts too) — the general stats view shows this instead of summing
  // per-container numbers
  rpc HostStats(Empty) returns (HostStatsResponse) {}
  rpc ContainerLogs(ContainerLogsRequest) returns (stream LogsMessage) {}
  // pushes filtered container lifecycle events (start/stop/die/health
  // transitions...) so views can refresh reactively instead of polling;
  // empty-action messages are keepalives
  rpc ContainerEvents(EventsRequest) returns (stream ContainerEvent) {}
  rpc ContainerLogsStream(LogsStreamRequest) returns (stream LogLine) {}
  rpc ContainerInspect(ContainerLogsRequest) returns (ContainerInspectMessage) {}

  // compose
  rpc ComposeUp(ComposeFile) returns (stream LogsMessage) {}
  rpc ComposeDown(ComposeFile) returns (stream LogsMessage) {}
  rpc ComposeStart(ComposeFile) returns (stream LogsMessage) {}
  rpc ComposeStop(ComposeFile) returns (stream LogsMessage) {}
  rpc ComposeRestart(ComposeFile) returns (stream LogsMessage) {}
  rpc ComposeUpdate(ComposeFile) returns (stream LogsMessage) {}
  // compose up -d with explicit force flags (pull / build / recreate),
  // so a stack can be redeployed in one action
  rpc ComposeRedeploy(ComposeRedeployRequest) returns (stream LogsMessage) {}
  rpc ComposeList(ComposeFile) returns (ListResponse) {}
  rpc ComposeValidate(ComposeFile) returns (ComposeValidateResponse) {}
  rpc ComposeFileStatus(ComposeFileStatusRequest) returns (ComposeFileStatusResponse) {}

  // runs a user-provided docker CLI command on the selected host and streams
  // its combined output; only the docker binary is allowed
  rpc DockerCommand(DockerCommandRequest) returns (stream LogsMessage) {}

  // images
  rpc ImageList(ListImagesRequest) returns (ListImagesResponse) {}
  rpc ImageRemove(RemoveImageRequest) returns (RemoveImageResponse) {}
  rpc ImagePruneUnused(ImagePruneRequest) returns (ImagePruneResponse) {}
  rpc ImageInspect(ImageInspectRequest) returns (ImageInspectResponse) {}

  // volumes
  rpc VolumeList(ListVolumesRequest) returns (ListVolumesResponse) {}
  rpc VolumeCreate(CreateVolumeRequest) returns (CreateVolumeResponse) {}
  rpc VolumeDelete(DeleteVolumeRequest) returns (DeleteVolumeResponse) {}
  rpc VolumeInspect(VolumeInspectRequest) returns (VolumeInspectResponse) {}

  // networks
  rpc NetworkList(ListNetworksRequest) returns (ListNetworksResponse) {}
  rpc NetworkCreate(CreateNetworkRequest) returns (CreateNetworkResponse) {}
  rpc NetworkDelete(DeleteNetworkRequest) returns (DeleteNetworkResponse) {}
  rpc NetworkInspect(NetworkInspectRequest) returns (NetworkInspectResponse) {}
}


message ComposeFileStatusRequest {
  repeated string files = 1;
}

message Status {
  int32 servicesUp = 1;
  int32 servicesDown = 2;
  int32 servicesHealthy = 3;
  int32 servicesUnHealthy = 4;
}

message ComposeFileStatusResponse {
  map<string, Status> status = 1;
}

message ContainerTopRequest {
  string containerId = 1;
}

message ContainerTopResponse {
  Top top = 1;
}

message Process {
  repeated string Processes = 1;
}

message Top {
  repeated Process proc = 1;
  repeated string Titles = 2;
}

message ContainerInspectMessage {
  string Name = 1;
  string ID = 2;
  string Path = 3;
  string Created = 7;
  string Image = 4;
  string HostsPath = 5;
  repeated ContainerMount mounts = 6;
  ContainerConfig config = 8;
}

message ContainerConfig {
  string Hostname = 1;
  string Domainname = 2;
  string User = 3;
  bool AttachStdin = 4;
  bool AttachStdout = 5;
  bool AttachStderr = 6;
  bool Tty = 7;
  bool OpenStdin = 8;
  bool StdinOnce = 9;

  bool ArgsEscaped = 10;
  string Image = 11;
  repeated string Env = 12;
  repeated string Cmd = 13;
  repeated string Volumes = 14;
  string WorkingDir = 15;
  repeated string Entrypoint = 16;
  map<string, string> Labels = 17;
  repeated string ExposedPorts = 18;

  //  Healthcheck     *HealthConfig
  //  NetworkDisabled bool
  //  OnBuild         []string
  //  StopSignal      string
  //  StopTimeout     *int
  //  Shell           []string
}

message ContainerMount {
  string Type = 1;
  string Name = 2;
  string Source = 3;
  string Destination = 4;
  string Driver = 5;
  string Mode = 6;
  bool RW = 7;
}

message ContainerListRequest {}

message NetworkInspectRequest {
  string networkId = 1;
}

message NetworkInspectResponse {
  NetworkInspectInfo inspect = 1;
}

message NetworkInspectInfo {
  Network net = 1;
  repeated NetworkContainerInspect container = 2;
}

message NetworkContainerInspect {
  string Name = 1;
  string Endpoint = 2;
  string IPv4 = 3;
  string IPv6 = 4;
  string Mac = 5;
}

message ImageInspectRequest {
  string imageId = 1;
}

message ImageInspectResponse {
  ImageInspect inspect = 1;
}

message ImageInspect {
  string name = 1;
  string id = 6;
  string size = 3;
  string arch = 5;
  string createdIso = 4;
  repeated ImageLayer layers = 2;
  repeated ImageContainerInspect containers = 7;
}

message ImageLayer {
  string LayerId = 3;
  string cmd = 1;
  string size = 2;
  string totalSizeAtLayer = 4;
}

message ImageContainerInspect {
  string name = 1;
  string id = 2;
  string state = 3;
  string composeProject = 4;
}

message ComposeValidateResponse {
  repeated string errs = 1;
}

// forwards commands from user to a running session
message ContainerExecCmdInput {
  string userCmd = 1;
  string containerID = 2;
}

message ContainerExecRequest {
  string containerID = 1;
  // if not provided uses '/bin/sh' as default
  repeated string execCmd = 2;
}

// Image-related messages
message Image {
  int64 containers = 1;
  int64 created = 2;
  string id = 3;
  map<string, string> labels = 4;
  string parent_id = 5;
  repeated ManifestSummary manifests = 7;
  repeated string repo_digests = 8;
  repeated string repo_tags = 9;
  int64 shared_size = 10;
  int64 size = 11;
  string updateRef = 12;
}

message ManifestSummary {
  string digest = 1;
  string media_type = 2;
  int64 size = 3;
}

message ListImagesRequest {

}

message ListImagesResponse {
  int64 totalDiskUsage = 1;
  int64 unusedImageCount = 2;
  int64 untaggedImageCount = 3;
  repeated Image images = 4;
}

message RemoveImageRequest {
  string host = 2;
  repeated string imageIds = 1;
}

message RemoveImageResponse {}

message ImagePruneResponse {
  uint64 SpaceReclaimed = 1;
  repeated ImagesDeleted deleted = 2;
}

message ImagePruneRequest {
  string host = 2;
  bool pruneAll = 1;
}

message ImagesDeleted {
  string Deleted = 1;
  string Untagged = 2;
}

// Volume-related messages
message Volume {
  string name = 1;
  string containerID = 2;
  string createdAt = 3;
  string mountPoint = 4;
  int64 size = 5;
  string labels = 6;
  string composePath = 7;
  string composeProjectName = 8;
}

message ListVolumesRequest {

}

message ListVolumesResponse {
  repeated Volume volumes = 1;
}

message CreateVolumeRequest {

}

message CreateVolumeResponse {
}

message DeleteVolumeRequest {
  string host = 4;
  repeated string volumeIds = 1;
  bool anon = 2;
  bool unused = 3;
}

message DeleteVolumeResponse {
}

message VolumeInspectRequest {
  string volumeName = 1;
}

message VolumeInspectResponse {
  VolumeInspectInfo inspect = 1;
}

message VolumeInspectInfo {
  Volume vol = 1;
  repeated VolumeContainerInspect containers = 2;
}

message VolumeContainerInspect {
  string name = 1;
  string id = 2;
  string destination = 3;
  bool rw = 4;
  string composeProject = 5;
}

// Network-related messages
message Network {
  string name = 1;
  string id = 2;
  string subnet = 3;
  string scope = 4;
  string driver = 5;
  bool enable_ipv4 = 6;
  bool enable_ipv6 = 7;
  bool internal = 9;
  bool attachable = 10;
  string createdAt = 11;
  string composeProject = 12;
  repeated string containerIds = 13;
}

message ListNetworksRequest {

}

message ListNetworksResponse {
  repeated Network networks = 1;
}

message CreateNetworkRequest {


}

message CreateNetworkResponse {
}

message DeleteNetworkRequest {

  repeated string networkIds = 3;
  bool prune = 2;
}

message DeleteNetworkResponse {
}

message EventsRequest {
  string host = 1;
}

message ContainerEvent {
  // create / start / stop / die / kill / restart / pause / unpause /
  // destroy / rename / update / oom / health_status.
  // Empty for keepalive frames.
  string action = 1;
  // health_status only: healthy / unhealthy / ...
  string status = 2;
  string containerId = 3;
  string containerName = 4;
  string image = 5;
  int64 timeNano = 6;
}

message ContainerLogsRequest {
  string containerID = 1;
}

message LogsMessage {
  string message = 1;
}

message LogsStreamRequest {
  // one id = single container view, several = merged stack view
  repeated string containerIds = 1;
  // number of trailing lines per container, <= 0 means the server default
  int32 tail = 2;
  // unix seconds bounds, 0 means unbounded
  int64 since = 3;
  int64 until = 4;
  // keep the stream open for new lines; false ends it once history is sent
  bool follow = 5;
}

// a frame with an empty containerId and text is a keepalive
message LogLine {
  string containerId = 1;
  string containerName = 2;
  // line content without the daemon timestamp prefix
  string text = 3;
  int64 timeNano = 4;
  // 1 = stdout, 2 = stderr
  int32 stream = 5;
}

message DockerCommandRequest {
  // full command line, e.g. "docker run --rm -p 8080:80 nginx:alpine"
  string command = 1;
}

message HostStatsResponse {
  // whole-host cpu usage in percent (0-100), 0 until two samples exist
  double cpuPercent = 1;
  int64 memUsed = 2;
  int64 memTotal = 3;
  int32 cpus = 4;
}

message StatsResponse {
  SystemInfo system = 1;
  repeated ContainerStats containers = 2;
}

enum SORT_FIELD {
  NAME = 0;
  CPU = 1;
  MEM = 2;
  NETWORK_RX = 3;
  NETWORK_TX = 4;
  DISK_R = 5;
  DISK_W = 6;
  STARTED = 7;
}

enum ORDER {
  DSC = 0; // default val
  ASC = 1;
}

message StatsRequest {
  string host = 4;
  ComposeFile file = 1;
  SORT_FIELD sortBy = 2;
  ORDER order = 3;
}

message SystemInfo {
  double CPU = 1; // represents float64
  uint64 memInBytes = 2;
}

message ListResponse {
  map<string, int32> statusCount = 1;
  repeated ContainerList list = 2;
}

message ContainerList {
  string id = 1;
  string imageID = 2;
  string imageName = 3;
  string state = 4;
  string health = 13;
  string name = 5;
  string created = 6;
  repeated Port ports = 7;
  // name to use in selecting service in docker compose
  string serviceName = 8;
  string servicePath = 9;
  string stackName = 10;
  string updateAvailable = 11;
  repeated string IPAddress = 12;
}

// ContainerInfo holds metrics for a single Docker container.
message ContainerStats {
  // Unique identifier of the container.
  string id = 1;
  // Name of the container.
  string name = 2;
  // CPU usage as a percentage.
  double cpu_usage = 3;
  // Current memory usage in bytes.
  uint64 memory_usage = 4;
  // Maximum memory limit in bytes.
  uint64 memory_limit = 5;
  // Total bytes received over the network.
  uint64 network_rx = 6;
  // Total bytes sent over the network.
  uint64 network_tx = 7;
  // Total bytes read from block devices.
  uint64 block_read = 8;
  // Total bytes written to block devices.
  uint64 block_write = 9;
  // Container start time (RFC3339). Empty if unknown / not running.
  string started_at = 10;
  // Image reference the container was created from.
  string image = 11;
  // Container state: running, exited, paused, restarting...
  string state = 12;
  // Health status: healthy / unhealthy / starting. Empty when the container
  // has no healthcheck.
  string health = 13;
  // Container network IP addresses.
  repeated string ip_address = 14;
  // How many times the container restarted.
  int32 restart_count = 15;
}


message Port {
  int32 public = 1;
  int32 private = 2;
  string host = 3;
  string type = 4;
}

message Empty{}

message ContainerRequest {
  repeated string containerIds = 1;

}

message ComposeFile {
  string filename = 1;

  repeated string selectedServices = 3;
}

message ComposeRedeployRequest {
  ComposeFile file = 1;
  // force-pull images (--pull always)
  bool pull = 2;
  // force-build images (--build)
  bool build = 3;
  // recreate containers even when nothing changed (--force-recreate)
  bool recreate = 4;
}
