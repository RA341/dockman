syntax = "proto3";

package dockyaml.v1;

option go_package = "github.com/RA341/dockman/generated/dockyaml/v1";

service DockyamlService {
  rpc Get(GetRequest) returns (GetResponse) {}
  rpc Save(SaveRequest) returns (SaveResponse) {}
  rpc GetYaml(GetYamlRequest) returns (GetYamlResponse) {}

}

message SaveRequest {
  bytes contents = 2;
}

message SaveResponse {}

message GetRequest {}

message GetResponse {
  bytes contents = 1;
}

message GetYamlRequest {}

message GetYamlResponse {
  DockmanYaml dock = 1;
}

message DockmanYaml {
  map<string, string> customTools = 9;
  bool useComposeFolders = 1;
  bool disableComposeQuickActions = 7;
  int32 searchLimit = 8;
  int32 tabLimit = 6;
  VolumesConfig volumesPage = 2;
  NetworkConfig networkPage = 3;
  ImageConfig imagePage = 4;
  ContainerConfig containerPage = 5;
  StatsConfig statsPage = 10;
  ComposeConfig composePage = 11;
  EditorConfig editorPage = 12;
  MonitorConfig monitorPage = 13;
  // view opened when landing on a host: files (default), monitor, stats,
  // containers, images, volumes, networks or cleaner
  string defaultView = 14;
}

message MonitorConfig {
  // stack row density in the monitor view: "full" (default) shows CPU/RAM
  // values with their charts, "compact" shows the values only
  string stackRows = 1;
}

message ComposeConfig {
  // tab shown when opening a compose stack: editor (default), deploy or stats
  string defaultTab = 1;
}

message EditorConfig {
  // allow scrolling half a viewport past the last line (it stops at
  // mid-view), for files taller than the viewport
  bool scrollPastEnd = 1;
}

message VolumesConfig {
  Sort sort = 1;
}

message NetworkConfig {
  Sort sort = 1;
}

message ImageConfig {
  Sort sort = 1;
}

message ContainerConfig {
  Sort sort = 1;
}

message StatsConfig {
  Sort sort = 1;
}


message Sort {
  string sortOrder = 1;
  string sortField = 2;
}

