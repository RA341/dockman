name: Clean up Dockman GHCR images
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only report what would be removed'
        type: boolean
        required: false
        default: true
      keep:
        description: 'Number of immutable integration builds to keep'
        type: number
        required: false
        default: 3

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout retention policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Apply reachability-aware retention
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=(
            --owner "${{ github.repository_owner }}"
            --package dockman
            --tag integration
            --keep "${{ inputs.keep || 3 }}"
          )
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            ARGS+=(--dry-run)
          fi
          python3 scripts/ghcr-retention.py "${ARGS[@]}"
